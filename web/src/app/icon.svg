<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- The logo: five bars of a fixed waveform knocked out of a panel, the peak
       lit violet. Keep in sync with the chrome device in
       components/site/rack/chrome.ts, which uses the same WAVE pattern. -->
  <style>
    .panel { fill: #17181a; }
    @media (prefers-color-scheme: dark) { .panel { fill: #eeefec; } }
  </style>
  <mask id="wave">
    <rect width="32" height="32" rx="7" fill="#fff" />
    <g fill="#000">
      <rect x="7"    y="12" width="2.6" height="8"  rx="0.7" />
      <rect x="10.9" y="6"  width="2.6" height="20" rx="0.7" />
      <rect x="14.8" y="13" width="2.6" height="6"  rx="0.7" />
      <rect x="18.7" y="9"  width="2.6" height="14" rx="0.7" />
      <rect x="22.6" y="11" width="2.6" height="10" rx="0.7" />
    </g>
  </mask>
  <rect class="panel" width="32" height="32" rx="7" mask="url(#wave)" />
  <!-- The peak. Violet reads on both grounds, so it is not themed. -->
  <rect x="10.9" y="6" width="2.6" height="20" rx="0.7" fill="#9b7cf0" />
</svg>
